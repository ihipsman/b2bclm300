<!DOCTYPE html>

  <title>Welcome to the CLM Job Board</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #fff; border-bottom: 1px solid #e5e5e5; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    main { flex: 1; display: flex; flex-direction: column; }
    #gate { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
    .gate-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 2.5rem 2rem; max-width: 420px; width: 100%; text-align: center; }
    .gate-card img { width: 220px; margin: 0 auto 20px; display: block; }
    .gate-card h1 { font-size: 20px; font-weight: 600; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    .gate-card p { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 1rem; }
    .gate-card p strong { color: #1a1a1a; font-weight: 500; }
    .subscribe-link { font-size: 12px; color: #9ca3af; margin-bottom: 1.5rem !important; }
    .subscribe-link a { color: #6366f1; text-decoration: none; }
    .subscribe-link a:hover { text-decoration: underline; }
    input[type="email"] { width: 100%; padding: 10px 14px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; margin-bottom: 0.625rem; color: #1a1a1a; transition: border-color 0.15s; }
    input[type="email"]:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    .btn-primary { width: 100%; padding: 10px 14px; font-size: 14px; font-weight: 500; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
    .btn-primary:hover { background: #333; }
    .status-msg { font-size: 13px; margin-top: 0.625rem; min-height: 18px; color: #6b7280; }
    .status-msg.error { color: #dc2626; }
    .status-msg.success { color: #16a34a; }
    #board { display: none; flex: 1; flex-direction: column; padding: 1.5rem 2rem; max-width: 1200px; width: 100%; margin: 0 auto; }
    .board-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid #e5e5e5; }
    .board-header h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
    .board-header .verified { font-size: 13px; color: #6b7280; margin-top: 2px; }
    .btn-secondary { padding: 7px 14px; font-size: 13px; font-weight: 500; background: #fff; color: #1a1a1a; border: 1px solid #e5e5e5; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
    .btn-secondary:hover { background: #f5f5f3; }
    .airtable-embed { border: 1px solid #e5e5e5; border-radius: 10px; flex: 1; min-height: 640px; }
    footer { text-align: center; padding: 1.25rem; font-size: 12px; color: #9ca3af; border-top: 1px solid #e5e5e5; background: #fff; }
    footer a { color: #6b7280; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="clm-logo.jpg" alt="B2B CLM 300+" style="height:28px;border-radius:4px;vertical-align:middle;" />
    </div>
  </header>

  <main>
    <div id="gate">
      <div class="gate-card">
        <img src="clm-logo.jpg" alt="B2B CLM 300+" />
        <h1>Welcome to the CLM Job Board</h1>
        <p>Exclusive to <strong>B2B CLM 300+</strong> subscribers.</p>
        <p class="subscribe-link"><strong>Not subscribed? <a href="https://b2bclm.beehiiv.com/" target="_blank">Join Here &rarr;</a></strong></p>
        <p>Updated every Monday morning with new postings and the status of prior postings.</p>
        <input type="email" id="email-input" placeholder="your@email.com" />
        <button class="btn-primary" onclick="verifyEmail()">Verify access</button>
        <p class="status-msg" id="status-msg"></p>
      </div>
    </div>

    <div id="board">
      <div class="board-header">
        <div>
          <h2>CLM Job Board</h2>
          <div class="verified" id="verified-msg"></div>
        </div>
        <button class="btn-secondary" onclick="signOut()">Sign out</button>
      </div>
      <iframe
        class="airtable-embed"
        src="https://airtable.com/embed/appoEQgLvNZZL0QDe/shrTFjSAZ7hgy8P70?viewControls=on"
        frameborder="0"
        onmousewheel=""
        width="100%"
        height="640">
      </iframe>
    </div>
  </main>

    const SESSION_KEY = 'clm_board_email';

    function verifyEmail() {
      const email = document.getElementById('email-input').value.trim().toLowerCase();
      const msg = document.getElementById('status-msg');
      msg.className = 'status-msg';
      if (!email || !email.includes('@')) {
        msg.className = 'status-msg error';
        msg.textContent = 'Please enter a valid email address.';
        return;
      }
      if (ALLOWED_EMAILS.includes(email)) {
        sessionStorage.setItem(SESSION_KEY, email);
        showBoard(email);
      } else {
        msg.className = 'status-msg error';
        msg.textContent = 'This email is not on the subscriber list. Please use your B2B CLM 300+ email.';
      }
    }

    const LOGGER_URL = 'https://script.google.com/macros/s/AKfycbys05WSUu6sGSYT5mjSZPq88oXzXfWnUk20WfNmwCqktrbRrL_p_vlmBVMMuvLUVn6f/exec';

    function logVisit(email) {
      var img = new Image();
      img.src = LOGGER_URL + '?email=' + encodeURIComponent(email);
    }

    function showBoard(email) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('board').style.display = 'flex';
      document.getElementById('verified-msg').textContent = 'Verified: ' + email;
      logVisit(email);
    }

    function signOut() {
      sessionStorage.removeItem(SESSION_KEY);
      document.getElementById('gate').style.display = 'flex';
      document.getElementById('board').style.display = 'none';
      document.getElementById('email-input').value = '';
      document.getElementById('status-msg').textContent = '';
    }

    document.getElementById('email-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') verifyEmail();
    });

    const saved = sessionStorage.getItem(SESSION_KEY);
    if (saved && ALLOWED_EMAILS.includes(saved)) {
      showBoard(saved);
    }
  </script>
