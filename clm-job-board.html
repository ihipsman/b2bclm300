<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to the CLM Job Board</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header .logo {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.01em;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #gate {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .gate-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .gate-card img {
      width: 200px;
      border-radius: 6px;
      margin-bottom: 1.25rem;
    }

    .gate-card h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .gate-card p {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .gate-card p strong {
      color: #1a1a1a;
      font-weight: 500;
    }

    .subscribe-link {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 1.5rem !important;
    }

    .subscribe-link a {
      color: #6366f1;
      text-decoration: none;
    }

    .subscribe-link a:hover { text-decoration: underline; }

    input[type="email"] {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      margin-bottom: 0.625rem;
      color: #1a1a1a;
      transition: border-color 0.15s;
    }

    input[type="email"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 500;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: #333; }

    .status-msg {
      font-size: 13px;
      margin-top: 0.625rem;
      min-height: 18px;
      color: #6b7280;
    }

    .status-msg.error { color: #dc2626; }
    .status-msg.success { color: #16a34a; }

    #board {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 1.5rem 2rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .board-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #e5e5e5;
    }

    .board-header h2 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .board-header .verified {
      font-size: 13px;
      color: #6b7280;
      margin-top: 2px;
    }

    .btn-secondary {
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-secondary:hover { background: #f5f5f3; }

    .airtable-embed {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      flex: 1;
      min-height: 640px;
    }

    footer {
      text-align: center;
      padding: 1.25rem;
      font-size: 12px;
      color: #9ca3af;
      border-top: 1px solid #e5e5e5;
      background: #fff;
    }

    footer a { color: #6b7280; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
